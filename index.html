<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chá de Casa Nova</title>
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1 id="hero-title">Chá de Casa Nova</h1>
    <div class="hero-names" id="hero-names">Letícia e Agapito</div>
    <div class="divider"></div>
    <p class="hero-intro" id="hero-intro"></p>
  </div>
</header>

<main class="section">
  <div class="wrap">
    <h2 class="section-title">Nossa listinha com carinho</h2>
    <p class="section-subtitle">Escolha um item abaixo, selecione um valor sugerido ou digite o quanto quiser contribuir.</p>
    <div class="items-grid" id="items-grid"></div>
  </div>
</main>

<footer class="site-footer">
  <p>Feito com carinho para o nosso novo lar 🌸</p>
  <a href="admin.html" class="admin-discreet-link" aria-label="admin">••</a>
</footer>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Fechar">&times;</button>
    <h3>Obrigado! 💛</h3>
    <p>Sua contribuição para <strong id="modal-item-name"></strong> significa muito para nós.</p>
    <div class="modal-amount" id="modal-amount"></div>
    <div class="pix-box">
      <code id="pix-key"></code>
      <button class="copy-btn" id="copy-pix-btn">Copiar chave</button>
    </div>
    <a class="whatsapp-btn" id="whatsapp-link" target="_blank" rel="noopener">Avisar pelo WhatsApp</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js?v=2"></script>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
